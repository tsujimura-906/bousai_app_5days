<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --blue-900: #0b4f87;
      --blue-700: #0d5f9f;
      --panel-bg: #f3f5f7;
      --card-bg: #f9fafb;
      --line: #dfe6ec;
      --text: #1e2b38;
      --muted: #6b7a89;
      --green: #2fb26d;
      --green-soft: #eafaf3;
      --shadow: rgba(23, 38, 58, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Noto Sans JP", "Segoe UI", sans-serif;
      background: #f3f3f3;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(180deg, #0c5a97 0%, #0e4f8d 100%);
      height: 62px;
      box-shadow: 0 1px 0 rgba(7, 25, 42, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .app-title {
      font-weight: 700;
      color: white;
      font-size: 28px;
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .menu-button {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: white;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-button:hover { opacity: 0.9; }

    .drawer {
      position: fixed;
      top: 62px;
      right: 18px;
      width: 180px;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
      display: none;
      overflow: hidden;
      z-index: 120;
    }

    .drawer.open { display: block; }

    .drawer a {
      display: block;
      text-decoration: none;
      color: var(--text);
      padding: 14px 16px;
      border-bottom: 1px solid #edf0f3;
      font-size: 15px;
    }

    .drawer a:last-child { border-bottom: 0; }

    .drawer a:hover { background: #f6f8fb; }

    main {
      max-width: 1040px;
      margin: 22px auto 30px;
      padding: 0 18px;
    }

    .content-wrap {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(180,190,200,0.6);
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(15, 32, 52, 0.04);
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .app-title { font-size: 22px; }
      .topbar { height: 56px; }
      .drawer { right: 10px; }
      main { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="app-title">防災アプリ</div>
      <button type="button" class="menu-button" aria-label="メニューを開く" onclick="toggleMenu()">☰</button>
    </div>
  </header>

  <nav id="menuDrawer" class="drawer" aria-label="メニュー">
    <a href="/">ホーム</a>
    <a href="/shelter_search">避難所検索</a>
    <a href="/shelter_register">避難所登録</a>
    <a href="/board">指示・発信ボード</a>
    {% if session.logged_in %}
      <a href="/logout">ログアウト</a>
    {% else %}
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>

  <main>
    <div class="content-wrap">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    function toggleMenu() {
      const drawer = document.getElementById('menuDrawer');
      if (!drawer) return;
      drawer.classList.toggle('open');
    }

    document.addEventListener('click', function (event) {
      const drawer = document.getElementById('menuDrawer');
      const button = document.querySelector('.menu-button');
      if (!drawer || !button) return;
      if (!drawer.contains(event.target) && !button.contains(event.target)) {
        drawer.classList.remove('open');
      }
    });
  </script>
</body>
</html>
