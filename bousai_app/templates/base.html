<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --blue-900: #0b4f87;
      --blue-700: #0d5f9f;
      --panel-bg: #f3f5f7;
      --card-bg: #f9fafb;
      --line: #dfe6ec;
      --text: #1e2b38;
      --muted: #6b7a89;
      --green: #2fb26d;
      --green-soft: #eafaf3;
      --shadow: rgba(23, 38, 58, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Noto Sans JP", "Segoe UI", sans-serif;
      background: #f3f3f3;
      color: var(--text);
    }

    body {
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(180deg, #0c5a97 0%, #0e4f8d 100%);
      height: 62px;
      box-shadow: 0 1px 0 rgba(7, 25, 42, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .app-title {
      font-weight: 700;
      color: white;
      font-size: 28px;
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .topnav {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-left: auto;
    }

    .topnav a {
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 999px;
      transition: background-color 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }

    .topnav a:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .topnav a.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    main {
      max-width: 1040px;
      margin: 22px auto 30px;
      padding: 0 18px;
    }

    .content-wrap {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    .card {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(180,190,200,0.6);
      border-radius: 16px;
      box-shadow: 0 2px 10px rgba(15, 32, 52, 0.04);
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .app-title { font-size: 22px; }
      .topbar { height: 56px; }
      .topnav { gap: 8px; }
      .topnav a { font-size: 13px; padding: 7px 8px; }
      main { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="app-title">防災アプリ</div>
      <nav class="topnav" aria-label="メインナビゲーション">
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>ホーム</a>
        <a href="/shelter_search" {% if request.path == '/shelter_search' %}class="active"{% endif %}>避難所検索</a>
        <a href="/shelter_register" {% if request.path == '/shelter_register' %}class="active"{% endif %}>避難所登録</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="content-wrap">
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
