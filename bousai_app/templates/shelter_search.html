{% extends "base.html" %}

{% block content %}
<style>
  .search-result-page {
    padding: 12px 0 30px;
  }

  .search-page-title {
    margin: 0 0 18px;
    font-size: clamp(28px, 4vw, 42px);
    line-height: 1.3;
    font-weight: 700;
    color: #1d2a36;
  }

  .search-controls {
    margin: 18px 0 16px;
    background: #f7f9fb;
    border: 1px solid #dfe7ee;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(33, 45, 60, 0.04);
    padding: 18px;
  }

  .search-controls-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .primary-button,
  .secondary-button,
  .nav-button {
    border: 1px solid #cfe0ef;
    border-radius: 10px;
    background: #ffffff;
    color: #144d82;
    font-weight: 700;
    font-size: 15px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .primary-button {
    background: #eaf3ff;
    border-color: #b9d1ee;
  }

  .primary-button:hover,
  .secondary-button:hover,
  .nav-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(16, 65, 120, 0.06);
  }

  .result-count {
    min-width: 96px;
    padding: 10px 12px;
    border: 1px solid #dfe7ee;
    background: #ffffff;
    border-radius: 10px;
    color: #1d2a36;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
  }

  .sort-select {
    position: relative;
    display: inline-flex;
    align-items: center;
    border: 1px solid #dfe7ee;
    border-radius: 10px;
    background: #fff;
    min-width: 170px;
    height: 42px;
    overflow: hidden;
  }

  .sort-select select {
    appearance: none;
    border: 0;
    background: transparent;
    color: #1d2a36;
    font-size: 15px;
    font-weight: 600;
    padding: 0 38px 0 12px;
    width: 100%;
    height: 100%;
    outline: none;
  }

  .sort-select::after {
    content: "▼";
    position: absolute;
    right: 12px;
    pointer-events: none;
    color: #42617d;
    font-size: 12px;
  }

  .filter-grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px 16px;
    padding-top: 12px;
    border-top: 1px solid #e5ebf1;
  }

  .filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #223547;
    font-size: 14px;
    font-weight: 600;
  }

  .filter-item input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: #0d5f9f;
  }

  .nav-button {
    background: #0d5f9f;
    color: white;
    border-color: #0d5f9f;
    min-width: 170px;
  }

  .map-card {
    position: static;
    z-index: auto;
    margin-top: 18px;
    border: 1px solid #dfe7ee;
    border-radius: 16px;
    background: #f3f5f7;
    box-shadow: 0 3px 12px rgba(33, 45, 60, 0.04);
    overflow: visible;
  }

  .map-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 18px 8px 18px;
    color: #0a5a9f;
    font-weight: 700;
    font-size: 26px;
  }

  .map-header .pin {
    width: 18px;
    height: 18px;
    display: inline-block;
    border-radius: 50%;
    background: #0d5f9f;
    position: relative;
    box-shadow: inset 0 0 0 4px #fff;
  }

  .map-header .pin::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .map-wrap {
    position: static;
    z-index: auto;
    padding: 0 14px 14px;
    overflow: visible;
  }

  #shelterMap {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 420px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #d9e0e8;
    background: #d8edf7;
    top: 0;
    left: 0;
  }

  .empty-result {
    margin-top: 18px;
    padding: 16px 18px;
    border: 2px solid #d9534f;
    border-radius: 12px;
    background: #fff5f5;
    color: #b42318;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    display: block;
  }

  .shelter-table-wrap {
    display: none;
  }

  @media (max-width: 768px) {
    .map-header { font-size: 22px; }
    #shelterMap { height: 300px; }
  }
</style>

<div class="search-result-page">
  <h2 class="search-page-title">避難所検索</h2>

  <div class="map-card card">
    <div class="map-header">
      <span class="pin" aria-hidden="true"></span>
      <span>避難所マップ</span>
    </div>
    <div class="map-wrap">
      <div id="shelterMap" aria-label="避難所マップ"></div>
    </div>
  </div>

  <div class="search-controls" aria-label="検索条件の設定">
    <div class="search-controls-row">
      <div class="control-group">
        <button type="button" class="primary-button">条件変更</button>
        <div class="result-count">ヒット数 0</div>
      </div>

      <div class="control-group">
        <label class="sort-select" aria-label="並び替え">
          <select>
            <option>▼並び替え</option>
            <option>距離が近い順</option>
            <option>避難所名順</option>
            <option>受け入れ人数順</option>
          </select>
        </label>
        <button type="button" class="nav-button">検索</button>
      </div>
    </div>

    <div class="filter-grid" aria-label="絞り込み条件">
      <label class="filter-item"><input type="checkbox" /> トイレ</label>
      <label class="filter-item"><input type="checkbox" /> 飲料水</label>
      <label class="filter-item"><input type="checkbox" /> 非常食</label>
      <label class="filter-item"><input type="checkbox" /> Wi-Fi</label>
      <label class="filter-item"><input type="checkbox" /> AED</label>
      <label class="filter-item"><input type="checkbox" /> 多目的トイレ</label>
      <label class="filter-item"><input type="checkbox" /> 車椅子対応</label>
      <label class="filter-item"><input type="checkbox" /> 言語対応</label>
    </div>
  </div>

  <div class="empty-result" aria-live="polite">
    避難所がありません 0件ヒット場合
  </div>

</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.__shelterSearchMapInitialized) return;
    window.__shelterSearchMapInitialized = true;

    const map = L.map('shelterMap', {
      zoomControl: true,
      attributionControl: false,
      scrollWheelZoom: false
    }).setView([35.3387, 139.4480], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);
  });
</script>
{% endblock %}
