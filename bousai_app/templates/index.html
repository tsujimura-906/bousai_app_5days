{% extends "base.html" %}

{% block content %}
<style>
  .home-panel {
    background: rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    padding: 0;
  }

  .map-card {
    margin-top: 18px;
    border: 1px solid #dfe7ee;
    border-radius: 16px;
    background: #f3f5f7;
    box-shadow: 0 3px 12px rgba(33, 45, 60, 0.04);
    overflow: hidden;
  }

  .map-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 18px 8px 18px;
    color: #0a5a9f;
    font-weight: 700;
    font-size: 26px;
  }

  .map-header .pin {
    width: 18px;
    height: 18px;
    display: inline-block;
    border-radius: 50%;
    background: #0d5f9f;
    position: relative;
    box-shadow: inset 0 0 0 4px #fff;
  }

  .map-header .pin::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .map-wrap {
    padding: 0 14px 14px;
  }

  #shelterMap {
    width: 100%;
    height: 420px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #d9e0e8;
    background: #d8edf7;
  }

  .weather-card {
    margin-top: 34px;
    border: 1px solid #dfe7ee;
    border-radius: 16px;
    background: #f3f5f7;
    box-shadow: 0 3px 12px rgba(33, 45, 60, 0.04);
    overflow: hidden;
  }

  .weather-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid #dfe7ee;
  }

  .weather-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 700;
    color: #0a5a9f;
    font-size: 26px;
  }

  .weather-title .cloud {
    font-size: 24px;
  }

  .auto-refresh {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(62, 170, 108, 0.4);
    background: #ecf8f0;
    color: #2a9d5b;
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .auto-refresh .icon {
    display: inline-block;
    font-size: 18px;
    transform: rotate(12deg);
  }

  .weather-body {
    padding: 18px 22px 22px;
  }

  .city-line {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #1d2e3d;
    font-size: 18px;
    font-weight: 700;
    margin: 2px 0 14px;
  }

  .city-line .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #4d6274;
    display: inline-block;
    position: relative;
    box-shadow: inset 0 0 0 2px #fff;
  }

  .status-ok {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #2ca05d;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .status-ok .check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #2ca05d;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 13px;
    font-weight: 900;
  }

  .warning-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .warning-badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.2;
  }

  .warning-badge.warning {
    background: #fde8e8;
    color: #b42318;
    border: 1px solid #f5b7b1;
  }

  .warning-badge.advisory {
    background: #fff5d6;
    color: #a16207;
    border: 1px solid #f3d57a;
  }

  .weather-meta {
    color: #4d5d6d;
    font-size: 16px;
    line-height: 1.9;
    margin-top: 8px;
  }

  .weather-meta .label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    text-align: center;
    margin-right: 8px;
    color: #4d5d6d;
  }

  @media (max-width: 768px) {
    .map-header, .weather-title { font-size: 22px; }
    #shelterMap { height: 300px; }
    .weather-head { align-items: flex-start; flex-direction: column; }
  }
</style>

<div class="map-card card">
  <div class="map-header">
    <span class="pin" aria-hidden="true"></span>
    <span>避難所マップ</span>
  </div>
  <div class="map-wrap">
    <div id="shelterMap" aria-label="避難所マップ"></div>
  </div>
</div>

<div class="weather-card card">
  <div class="weather-head">
    <div class="weather-title">
      <span class="cloud" aria-hidden="true">☁</span>
      <span>青森市 気象警報・注意報</span>
    </div>
    <button type="button" class="auto-refresh" id="autoRefreshButton">
      <span class="icon" aria-hidden="true">↻</span>
      <span>10分おき自動更新</span>
    </button>
  </div>

  <div class="weather-body">
    <div class="city-line"><span class="dot" aria-hidden="true"></span><span>青森市</span></div>
    <div class="status-ok" id="weatherStatus">
      <span class="check" aria-hidden="true">✓</span>
      <span>現在、警報・注意報は発表されていません</span>
    </div>

    <div class="weather-meta" id="weatherContent">
      <div><span class="label">◔</span>データ取得: <span id="lastFetchTime">取得中...</span></div>
      <div><span class="label">◌</span>気象庁発表: <span id="reportTime">取得中...</span></div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap', {
      zoomControl: true,
      attributionControl: false,
      scrollWheelZoom: false
    }).setView([35.3387, 139.4480], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const refreshButton = document.getElementById('autoRefreshButton');
    let autoRefreshEnabled = true;
    let refreshTimer = null;

    function renderWeather(data) {
      const lastFetch = document.getElementById('lastFetchTime');
      const reportTime = document.getElementById('reportTime');
      const status = document.getElementById('weatherStatus');

      if (lastFetch) lastFetch.textContent = data.last_fetch_time || '更新中...';
      if (reportTime) reportTime.textContent = data.report_time || '不明';

      if (data.error) {
        if (status) {
          status.innerHTML = '<span class="check" aria-hidden="true">✓</span><span>現在、警報・注意報は発表されていません</span>';
        }
        return;
      }

      const warnings = data.warnings || [];
      if (status) {
        if (warnings.length > 0) {
          const warningBadges = warnings.map(w => {
            const typeClass = (w.code === '43' || w.code === '49' || w.code === '03' || w.code === '04' || w.code === '05' || w.code === '08' || w.code === '09' || w.code === '32' || w.code === '33' || w.code === '35' || w.code === '36' || w.code === '37' || w.code === '38' || w.code === '39') ? 'warning' : 'advisory';
            return '<span class="warning-badge ' + typeClass + '">' + w.name + '</span>';
          }).join('');

          status.innerHTML = '<span class="check" aria-hidden="true">✓</span>' +
            '<div><span>現在、警報・注意報が発表されています</span><div class="warning-list">' + warningBadges + '</div></div>';
        } else {
          status.innerHTML = '<span class="check" aria-hidden="true">✓</span><span>現在、警報・注意報は発表されていません</span>';
        }
      }
    }

    function updateWeatherWarnings() {
      fetch('/api/weather_warnings')
        .then(response => response.json())
        .then(data => {
          renderWeather(data);
        })
        .catch(() => {
          renderWeather({
            error: true,
            last_fetch_time: '取得失敗',
            report_time: '不明'
          });
        });
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(updateWeatherWarnings, 600000);
      refreshButton.setAttribute('aria-pressed', 'true');
      refreshButton.style.filter = 'none';
    }

    function stopAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = null;
      refreshButton.setAttribute('aria-pressed', 'false');
      refreshButton.style.filter = 'grayscale(0.2)';
    }

    refreshButton.addEventListener('click', function() {
      autoRefreshEnabled = !autoRefreshEnabled;
      if (autoRefreshEnabled) {
        startAutoRefresh();
      } else {
        stopAutoRefresh();
      }
    });

    updateWeatherWarnings();
    startAutoRefresh();
  });
</script>
{% endblock %}
